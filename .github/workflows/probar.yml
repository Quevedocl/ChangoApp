name: Probar supermercados
on:
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Probar todas las cadenas
        run: |
          set -o pipefail
          python -u scrape.py probe all 2>&1 | tee scrape.log
      - name: Resumen del log
        if: always()
        run: python .github/resumen.py
