name: Actualizar precios
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "test = prueba rápida sin guardar, run = carga completa"
        type: choice
        default: test
        options: [test, run]
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        chain: [jumbo, santa-isabel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scrape.py "$MODO" ${{ matrix.chain }}
        env:
          MODO: ${{ github.event.inputs.modo || 'run' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
 
